# Configuration for src/chunking/ (Phase 6: Chunking)
#
# All relative paths are resolved against the project root
# (the directory containing this configs/ folder).
#
# Input is data/cleaned/sadhguru_cleaned.jsonl (Phase 5 + 5-b output): one
# JSON object per video (id, topic, text, raw_word_count, cleaned_word_count,
# genre). Each video's cleaned text is split independently into semantically
# coherent chunks via LlamaIndex's SemanticSplitterNodeParser -- chunks never
# span two videos, since topic/genre metadata needs to stay attached to the
# text it actually describes. Output feeds stage 7 (embeddings/Qdrant
# indexing).
#
# Switched 2026-09-11 from token-based SentenceSplitter (chunk_size=512,
# chunk_overlap=64) to semantic chunking: a fixed token window can sever a
# continuously developing thought mid-argument even at a clean sentence
# boundary. Semantic chunking embeds sentences and only cuts where meaning
# actually shifts -- see src/chunking/chunker.py's docstring for the full
# rationale.

input:
  cleaned_file: data/cleaned/sadhguru_cleaned.jsonl

output:
  chunks_file: data/chunks/sadhguru_chunks.jsonl

chunking:
  # HuggingFace model used only to embed sentences for chunk-boundary
  # detection (not Phase 7's final RAG embeddings). Qwen3-Embedding-0.6B was
  # tried first (higher MTEB score) but is only served via paid Inference
  # Providers partners, not HF's actually-free hf-inference tier -- burned
  # through the account's $0.10/month credit after 115/199 videos (402
  # Payment Required). BAAI/bge-m3 is confirmed free on hf-inference, and
  # matches Phase 7's planned embedding model too. See
  # chunker.py/hf_embeddings.py docstrings -- requires HF_TOKEN in .env.
  embedding_model: BAAI/bge-m3

  # Number of sentences grouped together before comparing to the next group.
  # 1 = compare sentence-by-sentence; >1 smooths over brief tangents so a
  # short aside within an otherwise continuous idea doesn't trigger a split.
  buffer_size: 1

  # Percentile of cosine dissimilarity between consecutive sentence groups
  # that must be exceeded to trigger a chunk split. Lower = more, smaller
  # chunks; higher = fewer, larger chunks.
  breakpoint_percentile_threshold: 95

  # How many sentences to send to the HF Inference API per HTTP request.
  # Kept well under the free tier's rate limit (~hundreds/hour) since each
  # video needs only a couple of batched requests, not one per sentence.
  embed_batch_size: 32

  # Post-process size safeguard (added after the first real run showed
  # 66/1176 chunks under 10 words -- mostly isolated interjections cut off
  # as their own node -- and 11 chunks over 1000 words, one at 3005). Any
  # chunk under min_chunk_words is merged into a neighbor; any chunk over
  # max_chunk_words is split back down via a plain sentence-greedy fill.
  # Pure text post-process on the already-generated chunks -- no extra HF
  # API calls.
  min_chunk_words: 10
  max_chunk_words: 512

logging:
  level: INFO
  log_file: logs/chunking.log
